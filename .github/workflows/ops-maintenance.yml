name: ops-maintenance

on:
  schedule:
    # 毎週月曜 10:00 JST（01:00 UTC）
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  security-maintenance:
    name: 依存監査 + 秘密スキャン
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high 以上をブロック)
        run: npm audit --audit-level=high

      - name: 秘密情報スキャン（コミット済みファイル）
        run: |
          rg -n --hidden -g '!.git/**' -g '!package-lock.json' -g '!node_modules/**' \
            -e 'postgresql://[^"'"'"' ]+' \
            -e 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            -e 'ghp_[A-Za-z0-9]{20,}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'napi_[A-Za-z0-9]{20,}' \
            -e 'sk-[A-Za-z0-9]{20,}' \
            . && exit 1 || exit 0

      - name: 失敗時は Issue を作成
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "[自動] 定期保守チェック失敗（依存監査または秘密スキャン）" \
            --body "GitHub Actions の ops-maintenance が失敗しました。
          詳細: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          対応: ログを確認し、脆弱性更新または秘密情報の除去・ローテーションを実施してください。"
