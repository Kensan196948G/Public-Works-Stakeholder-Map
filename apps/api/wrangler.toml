# Cloudflare Workers 設定 — default env が本番（Worker 名 pwsm-api）。
# 本番デプロイは PR マージ承認（Y）に明記された範囲でのみ実行する（docs/operations/deploy-runbook.md 参照）
name = "pwsm-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# 本番はカスタムドメインへ一本化（Cloudflare Access で保護）。
# workers.dev 経由の非保護アクセス経路は無効化する
workers_dev = false
routes = [
  { pattern = "pwsm.mirai-dx-platform.com", custom_domain = true }
]

# Workers Logs（本番ログ・エラー率・レイテンシ照会。Issue #23）
[observability]
enabled = true

# Web（apps/web）のビルド成果物を同一オリジンで静的配信する（Workers Static Assets）。
# Web は fetch('/api/v1/...') の相対パスで API を呼ぶため、単一 Worker への統合が前提。
# /api/* のみ Worker（Hono）が処理し、それ以外は assets → SPA fallback。
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# default env = 本番。ローカル開発は .dev.vars（gitignore 済み）で APP_ENV="local" を上書きする
APP_ENV = "production"
# DB モード時のデータ版識別子（デモ seed の公開版。公開版切替で更新する）
DATASET_VERSION = "2026-07-18.demo.1"

# アプリ内 RBAC（Issue #34）。既定は無効（従来の環境ガード 403 を維持）。
# 有効化時は AUTH_AUDIENCE / AUTH_JWKS_URL（または AUTH_CERT_PEM）と
# AUTH_ADMIN_EMAILS 等を設定する（詳細: docs/operations/auth-rbac.md）
AUTH_ENABLED = "false"
AUTH_AUDIENCE = ""
AUTH_JWKS_URL = ""

# preview 環境は明示的に分離した設定を使う（deploy:preview は --env preview で実行）
# preview は workers.dev で配信を継続する（custom domain なし・fixture モード）
[env.preview]
name = "pwsm-api-preview"
workers_dev = true

# assets は環境ごとに継承されないため preview にも明示定義する
[env.preview.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.preview.vars]
APP_ENV = "preview"
AUTH_ENABLED = "false"
AUTH_AUDIENCE = ""
AUTH_JWKS_URL = ""

# DATABASE_URL 等の秘密情報は wrangler secret put で登録し、このファイルへ書かない
