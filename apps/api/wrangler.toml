# Cloudflare Workers 設定 — default env が本番（Worker 名 pwsm-api）。
# 本番デプロイは PR マージ承認（Y）に明記された範囲でのみ実行する（docs/operations/deploy-runbook.md 参照）
name = "pwsm-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# 本番はカスタムドメインへ一本化（Cloudflare Access で保護）。
# workers.dev 経由の非保護アクセス経路は無効化する
workers_dev = false
routes = [
  { pattern = "pwsm.mirai-dx-platform.com", custom_domain = true }
]

# Workers Logs（本番ログ・エラー率・レイテンシ照会。Issue #23）
[observability]
enabled = true

# Web（apps/web）のビルド成果物を同一オリジンで静的配信する（Workers Static Assets）。
# Web は fetch('/api/v1/...') の相対パスで API を呼ぶため、単一 Worker への統合が前提。
# /api/* のみ Worker（Hono）が処理し、それ以外は assets → SPA fallback。
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# default env = 本番。ローカル開発は .dev.vars（gitignore 済み）で APP_ENV="local" を上書きする
APP_ENV = "production"
# DB モード時のデータ版識別子（デモ seed の公開版。公開版切替で更新する）
# データ版切替（2026-08-13・Issue #32）: 実データ（代表3地域・N03-20260101）を公開。
# デモデータは core で suspended 化済み。次回更新はこの値を更新して wrangler deploy する
DATASET_VERSION = "2026-08-13.real.1"

# アプリ内 RBAC（Issue #34・本番有効化済み v0.4.2）。
# 値は Cloudflare Access アプリ「pwsm」から自動取得した公開情報（aud・JWKS URL・ポリシー管理者メール）。
# 変更時は docs/operations/auth-rbac.md と整合させること
AUTH_ENABLED = "true"
AUTH_AUDIENCE = "03c85fb86ab820fff21918f63373867971b5adc8a3a838097f7858ca28ceb69c"
AUTH_JWKS_URL = "https://pwsm.mirai-dx-platform.com/cdn-cgi/access/certs"
AUTH_ADMIN_EMAILS = "kensan1969@gmail.com"
AUTH_REVIEWER_EMAILS = ""
AUTH_EDITOR_EMAILS = ""

# preview 環境は明示的に分離した設定を使う（deploy:preview は --env preview で実行）
# preview は workers.dev で配信を継続する（custom domain なし・fixture モード）
[env.preview]
name = "pwsm-api-preview"
workers_dev = true

# assets は環境ごとに継承されないため preview にも明示定義する
[env.preview.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.preview.vars]
APP_ENV = "preview"
# preview は認証検証用に同一設定を有効化（Access ポリシー対象外のため実質 401 のみ）
AUTH_ENABLED = "false"
AUTH_AUDIENCE = ""
AUTH_JWKS_URL = ""

# DATABASE_URL 等の秘密情報は wrangler secret put で登録し、このファイルへ書かない
