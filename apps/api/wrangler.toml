# Cloudflare Workers 設定（デプロイは人間の明示承認後に実行する）
name = "pwsm-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
APP_ENV = "local"

# preview 環境は明示的に分離した設定を使う（deploy:preview は --env preview で実行）
[env.preview]
name = "pwsm-api-preview"

[env.preview.vars]
APP_ENV = "preview"

# DATABASE_URL 等の秘密情報は wrangler secret put で登録し、このファイルへ書かない
