# ⚠️ 未適用の提案ワークフロー（このパスでは GitHub Actions として実行されない）
#
# 目的: ops-maintenance の失敗通知を 1 Issue に集約し、復旧時に自動クローズする。
#      併せて秘密情報スキャンの終了コード扱い（rg exit 2 以上 = スキャン失敗）を厳格化する。
#
# 状態: 2026-11-10 時点で **未適用**。DeepSeek Harness の self-evolution ポリシーゲートが
#       `.github/workflows/` 配下への書込みを DEPLOY（critical）として拒否するため、
#       エージェントから直接の適用ができない。適用は人手で行う。
#
# 適用方法（人手）:
#   cp docs/operations/proposed/ops-maintenance.dedupe.pending.yml .github/workflows/ops-maintenance.yml
#   node .github/scripts/validate-workflows.mjs
#   git switch -c auto/ops-maintenance-dedupe && git commit -am "chore(ci): 定期保守の失敗通知を集約し復旧時に自動クローズ" && git push
#   gh pr create --fill && (Required Checks 通過後に squash merge)
#
# 検証済み（2026-11-10・適用前）:
#   - node .github/scripts/validate-workflows.mjs（本ファイルをワークフロー配置で検証）= PASS
#   - bash -n / shellcheck -s bash -S warning = 指摘 0
#   - fake gh / fake rg による分岐シミュレーション 44 件 PASS
#   （作成・追記・重複時の最古集約・部分一致除外・rg 0/1/2/不在・一覧取得失敗時）
#
# 詳細は docs/operations/agent-team-runbook.md §6 を参照。

name: ops-maintenance

on:
  schedule:
    # 毎週月曜 10:00 JST（01:00 UTC）
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  # 重複 Issue 判定のキー。失敗時の追記・作成と成功時の自動クローズで同じ値を使う。
  ISSUE_TITLE: "[自動] 定期保守チェック失敗（依存監査または秘密スキャン）"

jobs:
  security-maintenance:
    name: 依存監査 + 秘密スキャン
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high 以上をブロック)
        id: audit
        run: npm audit --audit-level=high

      - name: 秘密情報スキャン（コミット済みファイル）
        id: secret_scan
        run: |
          # rg の終了コードで明示的に判定する。
          #   0      = 検出あり            -> 失敗（秘密情報の可能性）
          #   1      = 検出なし            -> 成功
          #   2 以上 = スキャン自体の失敗  -> 失敗（バイナリ走査エラー、rg 不在は 127 など）
          # 旧実装の `rg ... && exit 1 || exit 0` は 2 以上も「検出なし」と同じ成功扱いに
          # なり、スキャンできなかった実行を緑にしてしまう偽陰性があった。
          RG_STATUS=0
          rg -n --hidden -g '!.git/**' -g '!package-lock.json' -g '!node_modules/**' \
            -e 'postgresql://[^"'"'"' ]+' \
            -e 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            -e 'ghp_[A-Za-z0-9]{20,}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'napi_[A-Za-z0-9]{20,}' \
            -e 'sk-[A-Za-z0-9]{20,}' \
            . || RG_STATUS=$?
          echo "rg_exit_code=${RG_STATUS}"
          if [ "${RG_STATUS}" -eq 0 ]; then
            echo "::error::秘密情報の疑いがある文字列を検出しました（rg exit 0）。上の検出箇所を確認し、除去とローテーションを行ってください。"
            exit 1
          fi
          if [ "${RG_STATUS}" -ne 1 ]; then
            echo "::error::秘密情報スキャン自体が失敗しました（rg exit ${RG_STATUS}）。スキャン未実施を『検出なし』と扱わないため失敗にします。"
            exit 1
          fi
          echo "秘密情報スキャン: 検出なし（rg exit 1）"

      - name: 成功時は同一タイトルのオープン Issue を自動クローズ
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 復旧後に Issue が残留しないよう、成功した実行で同一タイトルのオープン
          # Issue をまとめてクローズする（過去の重複が残っている場合も対象）。
          # 判定は --search に頼らず「オープン Issue 全件のタイトル完全一致」で行う。
          # 部分一致や CJK の検索トークン化による取りこぼしは、逆に重複起票や
          # 誤クローズにつながるため。
          set -euo pipefail
          if ! OPEN_ISSUES="$(gh issue list --state open --limit 300 --json number,title --jq '.[] | [.number, .title] | @tsv')"; then
            echo "::warning::オープン Issue の取得に失敗したため自動クローズをスキップします（保守チェック自体は成功しています）。"
            exit 0
          fi
          FOUND=0
          CLOSED=0
          CLOSE_FAILED=0
          while IFS=$'\t' read -r NUM TITLE; do
            if [ -z "${NUM:-}" ]; then
              continue
            fi
            if [ "${TITLE}" != "${ISSUE_TITLE}" ]; then
              continue
            fi
            FOUND=$((FOUND + 1))
            if gh issue close "${NUM}" --comment "ops-maintenance が成功したため自動クローズ"; then
              CLOSED=$((CLOSED + 1))
              echo "クローズ: #${NUM}"
            else
              CLOSE_FAILED=$((CLOSE_FAILED + 1))
              echo "::warning::Issue #${NUM} の自動クローズに失敗しました（次回成功時に再試行されます）。"
            fi
          done <<< "${OPEN_ISSUES}"
          if [ "${FOUND}" -eq 0 ]; then
            echo "同一タイトルのオープン Issue はありません（クローズ不要）"
          else
            echo "同一タイトルのオープン Issue: ${FOUND} 件 / クローズ成功: ${CLOSED} 件 / 失敗: ${CLOSE_FAILED} 件"
          fi
          # 個々のクローズ失敗はゲート判定ではないため実行を失敗させない（::warning:: で可視化）。
          # ここで exit 1 にすると後続の失敗通知が走り、「保守チェック失敗」という
          # 誤った Issue を起票してしまう。

      - name: 失敗時は Issue を作成（既存があれば追記）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 失敗のたびに新規 Issue を作らず、同一タイトルのオープン Issue があれば
          # そこへ実行 URL と失敗時刻を追記して 1 本に集約する。
          # 判定は「オープン Issue 全件のタイトル完全一致」（部分一致による誤検知防止）。
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          UTC_NOW="$(date -u '+%Y-%m-%d %H:%M:%SZ')"
          JST_NOW="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
          BODY="$(printf '%s\n' \
            "GitHub Actions の ops-maintenance が失敗しました。" \
            "" \
            "- 実行: ${RUN_URL}" \
            "- 失敗時刻: ${UTC_NOW}（JST: ${JST_NOW}）" \
            "- 実行イベント: ${GITHUB_EVENT_NAME}" \
            "- 実行者: ${{ github.actor }}" \
            "- 依存監査（npm audit）: ${{ steps.audit.outcome || '未実行' }}" \
            "- 秘密スキャン: ${{ steps.secret_scan.outcome || '未実行' }}" \
            "" \
            "対応: 実行ログを確認し、依存脆弱性の更新または秘密情報の除去・ローテーションを行ってください。" \
            "復旧後にこのワークフローが成功すると、同一タイトルの Issue は自動でクローズされます。")"
          if ! OPEN_ISSUES="$(gh issue list --state open --limit 300 --json number,title --jq '.[] | [.number, .title] | @tsv')"; then
            echo "::error::オープン Issue の取得に失敗したため、既存 Issue への追記可否を判定できませんでした。"
            exit 1
          fi
          CANONICAL=""
          MATCHES=0
          while IFS=$'\t' read -r NUM TITLE; do
            if [ -z "${NUM:-}" ]; then
              continue
            fi
            if [ "${TITLE}" != "${ISSUE_TITLE}" ]; then
              continue
            fi
            MATCHES=$((MATCHES + 1))
            if [ -z "${CANONICAL}" ] || [ "${NUM}" -lt "${CANONICAL}" ]; then
              CANONICAL="${NUM}"
            fi
          done <<< "${OPEN_ISSUES}"
          if [ -n "${CANONICAL}" ]; then
            echo "同一タイトルのオープン Issue #${CANONICAL} に追記します（一致 ${MATCHES} 件）"
            if [ "${MATCHES}" -gt 1 ]; then
              echo "::warning::同一タイトルのオープン Issue が ${MATCHES} 件あります。追記先は最古の #${CANONICAL} です。重複分の整理を検討してください。"
            fi
            gh issue comment "${CANONICAL}" --body "${BODY}"
          else
            echo "同一タイトルのオープン Issue が無いため新規作成します"
            gh issue create --title "${ISSUE_TITLE}" --body "${BODY}"
          fi
